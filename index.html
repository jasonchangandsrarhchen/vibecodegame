<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON ABYSS PROTOCOL — Tactical Prototype</title>
<style>
:root{--bg:#070b16;--panel:#10192b;--line:#263b55;--cyan:#59e6ed;--pink:#ff4e87;--amber:#ffbd62;--green:#8df0ad;--muted:#8da4bc;--white:#e9f4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#19324b 0,#070b16 65%);color:var(--white);font:14px/1.45 system-ui,"Noto Sans TC",sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #22344a;background:#080e1bdc;position:sticky;top:0;z-index:2}
.brand{font-weight:900;letter-spacing:.14em;font-size:18px}.brand span{color:var(--cyan)}.tag{color:var(--muted);font-size:11px;letter-spacing:.18em}
main{max-width:1450px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(600px,1fr) 330px;gap:16px}
.panel{background:linear-gradient(160deg,#121f32,#0c1423);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 14px 40px #0005}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.phase{color:var(--cyan);font-weight:800;letter-spacing:.12em}.hint{color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;aspect-ratio:10/8;max-width:900px;margin:auto}
.tile{position:relative;min-width:0;border:1px solid #253b50;border-radius:5px;background:linear-gradient(145deg,#17283b,#101b2b);color:white;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:.12s}
.tile:hover{border-color:var(--cyan);filter:brightness(1.25)}.tile.wall{background:repeating-linear-gradient(135deg,#1b2633,#1b2633 6px,#111b28 6px,#111b28 12px);border-color:#506073;cursor:not-allowed}
.tile.cover{background:linear-gradient(145deg,#314052,#1c2b3d);border-color:#73899d}.tile.reach{outline:2px solid #59e6edaa;outline-offset:-2px;background:#16414a}.tile.target{outline:2px solid var(--pink);outline-offset:-2px}
.coord{position:absolute;left:4px;top:2px;color:#71869b;font-size:8px;opacity:.45}
.unit,.enemy{width:70%;height:70%;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2vw,24px);font-weight:900;position:relative}
.unit{background:#123d50;border:2px solid var(--cyan);color:#aafaff;box-shadow:0 0 14px #4be3ed55}.unit.selected{box-shadow:0 0 0 3px #fff,0 0 22px var(--cyan);transform:scale(1.06)}
.enemy{background:#4b1b38;border:2px solid var(--pink);color:#ffd3e2;box-shadow:0 0 14px #ff4e8755}
.hp{position:absolute;bottom:-7px;left:0;width:100%;height:4px;background:#263346;border-radius:4px;overflow:hidden}.hp i{display:block;height:100%;background:var(--green)}
.apdots{position:absolute;top:-5px;right:-5px;display:flex;gap:2px}.apdots i{width:6px;height:6px;border-radius:50%;background:var(--amber);border:1px solid #09111e}
.intent{position:absolute;right:1px;top:1px;font-size:9px;background:#1a1523;color:#ffb4cb;border:1px solid #87415c;border-radius:4px;padding:0 3px;z-index:1}
.turret{color:var(--green);font-size:20px;text-shadow:0 0 12px var(--green)}
.side{display:flex;flex-direction:column;gap:12px}.unitcard{padding:10px;border:1px solid #2a4159;border-radius:8px;background:#0d1928;cursor:pointer}.unitcard.active{border-color:var(--cyan);box-shadow:inset 3px 0 var(--cyan)}.unitrow{display:flex;justify-content:space-between;align-items:center}.unitname{font-weight:800}.role{font-size:10px;color:var(--muted)}.bar{height:6px;background:#27364a;border-radius:5px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.stats{font-size:11px;color:var(--muted);margin-top:5px}
button.action{background:#14283b;border:1px solid #36516b;color:var(--white);padding:9px 11px;border-radius:7px;cursor:pointer;font-weight:700}button.action:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}button.action:disabled{opacity:.35;cursor:not-allowed}button.primary{background:#15515c;border-color:#3ac6d0;color:#eaffff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.actions .wide{grid-column:1/-1}
.skilldesc{color:var(--muted);font-size:11px;margin-top:5px}.log{height:160px;overflow:auto;font-size:12px;color:#b8c9da;display:flex;flex-direction:column;gap:6px}.log p{margin:0;padding-bottom:5px;border-bottom:1px solid #1e3044}.log .good{color:var(--green)}.log .bad{color:#ff8eac}.log .info{color:var(--cyan)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11px;margin:12px 2px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.modal{position:fixed;inset:0;background:#030711d9;display:none;align-items:center;justify-content:center;z-index:5;padding:20px}.modalbox{max-width:480px;width:100%;padding:26px;background:#101d30;border:1px solid var(--cyan);border-radius:14px;text-align:center;box-shadow:0 0 60px #30c9d955}.modalbox h2{letter-spacing:.12em}.rewardChoices{display:grid;gap:9px;margin-top:18px}.rewardChoice{width:100%;text-align:left;padding:13px;border:1px solid #36516b;border-radius:9px;background:#14283b;color:var(--white);cursor:pointer}.rewardChoice:hover{border-color:var(--cyan);background:#18394a}.rewardChoice b{display:block;color:var(--cyan);font-size:14px}.rewardChoice small{display:block;color:var(--muted);margin-top:4px}.progressbar{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-bottom:10px}.progressbar b{color:var(--amber)}
@media(max-width:1000px){main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}}
@media(max-width:650px){header{padding:12px}.brand{font-size:14px}main{padding:8px;grid-template-columns:1fr}.side{display:flex}.panel{padding:9px}.board{gap:2px}.tile{border-radius:3px}.coord{font-size:6px}.intent{font-size:7px}}
</style></head>
<body>
<header><div><div class="brand">NEON <span>ABYSS</span> PROTOCOL</div><div class="tag">TURN-BASED TACTICAL ROGUELITE · PROTOTYPE 0.2</div></div><div class="tag">NEXUS CONTAINMENT INITIATIVE</div></header>
<main>
<section class="panel"><div class="topline"><div><div class="phase" id="phase">PLAYER PHASE</div><div class="hint" id="turnhint">選擇作戰員，移動並攻擊。敵人意圖會預先顯示。</div></div><button class="action primary" id="endTurn">結束回合 →</button></div><div class="board" id="board"></div><div class="legend"><span><i class="dot" style="background:#123d50;border:1px solid #59e6ed"></i>我方作戰員</span><span><i class="dot" style="background:#4b1b38;border:1px solid #ff4e87"></i>敵方單位</span><span><i class="dot" style="background:#314052"></i>掩體（減傷）</span><span>◆ 紅色標記：敵方預告行動</span></div></section>
<aside class="side">
<section class="panel"><div class="topline"><strong>STRIKE TEAM / 小隊</strong><span class="tag" id="teamcount">3 ACTIVE</span></div><div id="roster"></div><div id="selectedInfo" class="skilldesc">選擇一名作戰員查看技能。</div><div class="actions"><button class="action" id="skillBtn" disabled>使用技能</button><button class="action" id="waitBtn">待命</button><button class="action wide" id="cancelSkill">取消技能選取</button></div></section>
<section class="panel"><div class="topline"><strong>敵方戰術預告</strong><span class="tag" id="enemycount">4 HOSTILES</span></div><div id="intentList" class="skilldesc"></div></section>
<section class="panel"><div class="topline"><strong>戰場紀錄</strong><span class="tag">COMBAT LOG</span></div><div class="log" id="log"></div></section>
</aside></main>
<div class="modal" id="modal"><div class="modalbox"><div class="tag" id="modalTag">NEXUS COMBAT REPORT</div><h2 id="resultTitle">MISSION COMPLETE</h2><p id="resultText"></p><div id="rewardChoices" class="rewardChoices"></div></div></div>
<script>
const W=10,H=8;
const walls=new Set(['4,1','4,2','4,3','4,4','6,5','6,6']);
const covers=new Set(['2,1','2,5','5,6','8,2','8,6']);
let turn=1,stage=1,credits=0,kills=0,phase='player',selected='phantom',skillMode=null,shieldTeam=false,turrets=[],logs=[],gameOver=false,rewardOptions=[],turretDamage=18;
let units=[
{id:'phantom',name:'PHANTOM / 幽影',role:'突擊斥候 · 精準輸出',icon:'✦',x:1,y:1,hp:92,max:92,ap:2,range:3,damage:31,skill:'影襲',skillText:'消耗 2 AP：瞬移至目標敵人附近並造成 24 點傷害。',skillUsed:false},
{id:'bastion',name:'BASTION / 堡壘',role:'重裝防衛 · 小隊保護',icon:'⬡',x:1,y:3,hp:132,max:132,ap:2,range:1,damage:25,skill:'守護力場',skillText:'消耗 2 AP：本回合我方全員受到的傷害降低 50%。',skillUsed:false},
{id:'engineer',name:'ENGINEER / 工程師',role:'戰場控制 · 自動砲塔',icon:'⌘',x:1,y:6,hp:86,max:86,ap:2,range:3,damage:21,skill:'部署砲塔',skillText:'消耗 2 AP：在指定空格部署砲塔，敵方回合結束時自動攻擊。',skillUsed:false}
];
let enemies=[
{id:'drone1',name:'巡邏無人機',kind:'drone',icon:'◉',x:8,y:1,hp:48,max:48,damage:16,range:4,intent:'',target:null},
{id:'rusher1',name:'突襲機兵',kind:'rusher',icon:'➤',x:8,y:4,hp:62,max:62,damage:22,range:1,intent:'',target:null},
{id:'sniper1',name:'狙擊單位',kind:'sniper',icon:'⌖',x:8,y:6,hp:43,max:43,damage:19,range:5,intent:'',target:null},
{id:'drone2',name:'守衛機械',kind:'drone',icon:'◇',x:5,y:0,hp:54,max:54,damage:14,range:3,intent:'',target:null}
];
const $=id=>document.getElementById(id);
function log(msg,kind=''){logs.unshift({msg,kind});logs=logs.slice(0,24);$('log').innerHTML=logs.map(x=>'<p class="'+x.kind+'">'+x.msg+'</p>').join('')}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function aliveUnits(){return units.filter(u=>u.hp>0)}
function aliveEnemies(){return enemies.filter(e=>e.hp>0)}
function unitAt(x,y){return units.find(u=>u.hp>0&&u.x===x&&u.y===y)}
function enemyAt(x,y){return enemies.find(e=>e.hp>0&&e.x===x&&e.y===y)}
function blocked(x,y){return x<0||y<0||x>=W||y>=H||walls.has(x+','+y)||unitAt(x,y)||enemyAt(x,y)||turrets.some(t=>t.x===x&&t.y===y)}
function lineClear(a,b){let dx=b.x-a.x,dy=b.y-a.y,n=Math.max(Math.abs(dx),Math.abs(dy));for(let i=1;i<n;i++){let x=Math.round(a.x+dx*i/n),y=Math.round(a.y+dy*i/n);if(walls.has(x+','+y))return false}return true}
function pathTo(u,x,y,max=3){let q=[{x:u.x,y:u.y,path:[]}],seen=new Set([u.x+','+u.y]);while(q.length){let p=q.shift();if(p.x===x&&p.y===y)return p.path;if(p.path.length>=max)continue;for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=p.x+dx,ny=p.y+dy,k=nx+','+ny;if(seen.has(k)||blocked(nx,ny))continue;seen.add(k);q.push({x:nx,y:ny,path:[...p.path,{x:nx,y:ny}]})}}return null}
function planIntent(e){let targets=aliveUnits().sort((a,b)=>dist(e,a)-dist(e,b));let t=targets[0];if(!t){e.intent='';return}e.target=t.id;let d=dist(e,t);if(e.kind==='rusher'){e.intent=d<=1?'攻擊 '+t.name.split('/')[0]:'突進靠近 '+t.name.split('/')[0]}else if(d<=e.range&&lineClear(e,t)){e.intent='射擊 '+t.name.split('/')[0]}else e.intent='移動接近 '+t.name.split('/')[0]}
function planAll(){aliveEnemies().forEach(planIntent)}
function render(){
$('phase').textContent=phase==='player'?'SECTOR '+stage+' · PLAYER PHASE · 第 '+turn+' 回合':phase==='enemy'?'SECTOR '+stage+' · ENEMY PHASE':'SECTOR '+stage+' · MISSION COMPLETE';$('turnhint').textContent=phase==='player'?'選擇作戰員，移動並攻擊。紅色標記是敵方下一步行動。':phase==='enemy'?'敵方正在執行預告行動…':'戰場已清空。領取獎勵後前往下一區。';
$('teamcount').textContent=aliveUnits().length+' ACTIVE';$('enemycount').textContent=aliveEnemies().length+' HOSTILES';
$('board').innerHTML='';
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
let u=unitAt(x,y),e=enemyAt(x,y),wall=walls.has(x+','+y),cover=covers.has(x+','+y),reach=phase==='player'&&units.some(a=>a.id===selected&&a.hp>0&&a.ap>0&&pathTo(a,x,y,3)?.length),tile=document.createElement('button');
tile.className='tile'+(wall?' wall':'')+(cover?' cover':'')+(reach&&!u&&!e&&!wall?' reach':'')+(e&&phase==='player'&&units.some(a=>a.id===selected&&a.hp>0&&a.ap>0&&dist(a,e)<=a.range&&lineClear(a,e))?' target':'');
let content='<span class="coord">'+x+','+y+'</span>';
if(wall)content+='▧';else if(u){content+='<div class="unit '+(u.id===selected?'selected':'')+'">'+u.icon+'<span class="hp"><i style="width:'+u.hp/u.max*100+'%"></i></span><span class="apdots">'+Array.from({length:u.ap},()=>'<i></i>').join('')+'</span></div>'}
else if(e){content+='<div class="enemy">'+e.icon+'<span class="hp"><i style="width:'+e.hp/e.max*100+'%"></i></span><span class="intent">'+(e.kind==='rusher'?'⚠':e.kind==='sniper'?'⌖':'!')+'</span></div>'}
else if(turrets.some(t=>t.x===x&&t.y===y))content+='<span class="turret">⌖</span>';
tile.innerHTML=content;tile.title=wall?'障礙物':cover?'掩體':u?u.name:e?e.name:'';
tile.onclick=()=>cellClick(x,y);$('board').appendChild(tile)
}
$('roster').innerHTML=units.map(u=>'<div class="unitcard '+(u.id===selected?'active':'')+'" data-unit="'+u.id+'"><div class="unitrow"><span class="unitname">'+u.icon+' '+u.name+'</span><span class="tag">'+u.ap+' AP</span></div><div class="role">'+u.role+'</div><div class="bar"><i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i></div><div class="stats">HP '+Math.max(0,u.hp)+' / '+u.max+' · 攻擊 '+u.damage+' · 射程 '+u.range+'</div></div>').join('');
document.querySelectorAll('[data-unit]').forEach(el=>el.onclick=()=>{if(phase!=='player')return;selected=el.dataset.unit;skillMode=null;render()});
let s=units.find(u=>u.id===selected);$('selectedInfo').innerHTML=s?'<b>'+s.skill+'</b><br>'+s.skillText+'<br><br>目前 AP：'+s.ap+' / 2':'';
$('skillBtn').disabled=phase!=='player'||!s||s.hp<=0||s.ap<2||s.skillUsed;$('skillBtn').textContent=skillMode?'選擇目標格…':'使用 '+(s?s.skill:'技能');
$('intentList').innerHTML=aliveEnemies().map(e=>'<div style="padding:5px 0;border-bottom:1px solid #26384b"><b style="color:#ff91b2">'+e.icon+' '+e.name+'</b><br><span>預告：'+e.intent+'</span></div>').join('')||'沒有剩餘敵人。';
$('endTurn').disabled=phase!=='player'||gameOver;
}
function cellClick(x,y){
if(phase!=='player'||gameOver)return;
let u=unitAt(x,y),e=enemyAt(x,y),s=units.find(a=>a.id===selected);
if(u){selected=u.id;skillMode=null;render();return}
if(!s||s.hp<=0||s.ap<=0)return;
if(skillMode){
 if(s.id==='phantom'&&e){if(dist(s,e)>4){log('目標超出影襲距離。','bad');return}let spots=[[e.x+1,e.y],[e.x-1,e.y],[e.x,e.y+1],[e.x,e.y-1]].filter(([a,b])=>!blocked(a,b));if(!spots.length){log('目標周圍沒有可瞬移位置。','bad');return}let [nx,ny]=spots[0];s.x=nx;s.y=ny;s.ap-=2;s.skillUsed=true;e.hp-=24;log('幽影發動影襲，對 '+e.name+' 造成 24 點傷害。','good');if(e.hp<=0){kills++;log(e.name+' 已被摧毀。','good')}skillMode=null;checkEnd();render();return}
 if(s.id==='engineer'&&!blocked(x,y)){s.ap-=2;s.skillUsed=true;turrets.push({x,y,damage:18});log('工程師部署自動砲塔。','good');skillMode=null;render();return}
 log('請選擇有效的技能目標。','bad');return
}
if(e){if(dist(s,e)>s.range||!lineClear(s,e)){log('目標超出射程或視線被阻擋。','bad');return}e.hp-=s.damage;s.ap--;log(s.name+' 攻擊 '+e.name+'，造成 '+s.damage+' 點傷害。','good');if(e.hp<=0){kills++;log(e.name+' 已被摧毀。','good')}checkEnd();render();return}
let path=pathTo(s,x,y,3);if(!path||!path.length){log('該位置無法抵達。','bad');return}s.x=x;s.y=y;s.ap--;log(s.name+' 移動 '+path.length+' 格，消耗 1 AP。','info');render()
}
function useSkill(){let s=units.find(u=>u.id===selected);if(!s||s.ap<2||s.skillUsed||phase!=='player')return;if(s.id==='bastion'){s.ap-=2;s.skillUsed=true;shieldTeam=true;log('堡壘啟動守護力場：本回合全隊減傷 50%。','good');render()}else{skillMode=s.id;log(s.id==='phantom'?'選擇一名 4 格內的敵人發動影襲。':'選擇空格部署砲塔。','info');render()}}
function enemyPhase(){
phase='enemy';render();
for(let e of aliveEnemies()){
let t=units.find(u=>u.id===e.target&&u.hp>0)||aliveUnits().sort((a,b)=>dist(e,a)-dist(e,b))[0];if(!t)break;
let d=dist(e,t),canShoot=d<=e.range&&lineClear(e,t);
if(e.kind==='rusher'){
 if(d<=1)hitUnit(e,t);else{let options=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>!blocked(p.x,p.y)).sort((a,b)=>Math.abs(a.x-t.x)+Math.abs(a.y-t.y)-Math.abs(b.x-t.x)-Math.abs(b.y-t.y));if(options[0]){e.x=options[0].x;e.y=options[0].y;log(e.name+' 突進至新位置。','bad')}}
}else if(canShoot)hitUnit(e,t);else{let options=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>!blocked(p.x,p.y)).sort((a,b)=>Math.abs(a.x-t.x)+Math.abs(a.y-t.y)-Math.abs(b.x-t.x)-Math.abs(b.y-t.y));if(options[0]){e.x=options[0].x;e.y=options[0].y;log(e.name+' 重新部署位置。','bad')}}
}
for(let turret of turrets){let target=aliveEnemies().sort((a,b)=>dist(turret,a)-dist(turret,b))[0];if(target){target.hp-=turretDamage;log('自動砲塔命中 '+target.name+'，造成 '+turretDamage+' 點傷害。','good');if(target.hp<=0){kills++;log(target.name+' 被砲塔摧毀。','good')}}}
shieldTeam=false;checkEnd();if(!gameOver){turn++;phase='player';units.forEach(u=>{u.ap=u.hp>0?2:0;u.skillUsed=false});planAll();log('第 '+turn+' 回合開始。敵方意圖已更新。','info')}render()
}
function hitUnit(e,u){let dmg=e.damage;if(covers.has(u.x+','+u.y))dmg=Math.ceil(dmg*.6);if(shieldTeam)dmg=Math.ceil(dmg*.5);u.hp-=dmg;log(e.name+' 攻擊 '+u.name+'，造成 '+dmg+' 點傷害。','bad');if(u.hp<=0)log(u.name+' 失去作戰能力！','bad')}
function checkEnd(){if(aliveEnemies().length===0){finish(true);return}if(aliveUnits().length===0)finish(false)}
function finish(win){
 if(gameOver)return;
 gameOver=true;phase='over';$('modal').style.display='flex';
 $('modalTag').textContent=win?'NEXUS REWARD TERMINAL':'NEXUS COMBAT REPORT';
 $('resultTitle').textContent=win?'SECTOR '+stage+' CLEARED':'SQUAD ELIMINATED';
 if(win){
   let reward=35+stage*15+aliveEnemies().length*0;
   credits+=reward;
   $('resultText').textContent='戰場清除！獲得 '+reward+' 信用點。選擇一項戰利品，強化小隊後繼續深入。';
   const pool=[
    {name:'超載彈藥',desc:'全隊傷害永久提升 20%。',apply:()=>units.forEach(u=>u.damage=Math.round(u.damage*1.2))},
    {name:'奈米修復',desc:'全隊恢復 40% 最大生命值。',apply:()=>units.forEach(u=>{if(u.hp>0)u.hp=Math.min(u.max,u.hp+Math.ceil(u.max*.4))})},
    {name:'強化裝甲',desc:'全隊最大生命值 +20，並立即修復 20 點。',apply:()=>units.forEach(u=>{u.max+=20;if(u.hp>0)u.hp=Math.min(u.max,u.hp+20)})},
    {name:'砲塔超頻',desc:'工程師砲塔傷害永久 +10。',apply:()=>turretDamage+=10},
    {name:'戰術訓練',desc:'全隊攻擊射程 +1。',apply:()=>units.forEach(u=>u.range+=1)}
   ];
   rewardOptions=pool.sort(()=>Math.random()-.5).slice(0,3);
   $('rewardChoices').innerHTML=rewardOptions.map((r,i)=>'<button class="rewardChoice" onclick="chooseReward('+i+')"><b>'+String(i+1)+'. '+r.name+'</b><small>'+r.desc+'</small></button>').join('');
 }else{
   $('resultText').textContent='小隊全員失去作戰能力。這次遠征到此結束；重新部署可從第一區開始。';
   $('rewardChoices').innerHTML='<button class="action primary" onclick="location.reload()">重新部署 · 從第一區開始</button>';
 }
 render();
}
function chooseReward(index){
 if(!gameOver||phase!=='over'||!rewardOptions[index])return;
 const reward=rewardOptions[index];reward.apply();log('取得戰利品：'+reward.name+'。','good');
 stage++;turn=1;gameOver=false;phase='player';skillMode=null;shieldTeam=false;turrets=[];
 units.forEach(u=>{u.x=1;u.y=u.id==='phantom'?1:u.id==='bastion'?3:6;u.hp=Math.max(1,u.hp);u.ap=2;u.skillUsed=false});
 spawnStage();planAll();$('modal').style.display='none';
 log('進入第 '+stage+' 區。敵方增援已抵達。','info');render();
}
function spawnStage(){
 const scale=1+(stage-1)*.16;
 if(stage%5===0){
  enemies=[{id:'boss'+stage,name:'收割者級主宰',kind:'rusher',icon:'☠',x:8,y:3,hp:Math.round(210*scale),max:Math.round(210*scale),damage:Math.round(28*scale),range:1,intent:'',target:null},
  {id:'guard'+stage,name:'主宰護衛',kind:'drone',icon:'◇',x:8,y:6,hp:Math.round(65*scale),max:Math.round(65*scale),damage:Math.round(18*scale),range:4,intent:'',target:null}];
  log('警告：第 '+stage+' 區為 Boss 戰！','bad');
 }else{
  const spots=[[8,1],[8,4],[8,6],[5,0],[9,2],[9,5],[7,7],[6,0],[9,7]];
  const count=Math.min(3+Math.floor(stage/2),spots.length);
  enemies=spots.slice(0,count).map((p,i)=>{let kind=i%3===0?'drone':i%3===1?'rusher':'sniper',base=kind==='rusher'?62:kind==='sniper'?43:48;
   return {id:'s'+stage+'e'+i,name:kind==='rusher'?'突襲機兵':kind==='sniper'?'狙擊單位':'巡邏無人機',kind,icon:kind==='rusher'?'➤':kind==='sniper'?'⌖':'◉',x:p[0],y:p[1],hp:Math.round(base*scale),max:Math.round(base*scale),damage:Math.round((kind==='rusher'?22:kind==='sniper'?19:16)*scale),range:kind==='rusher'?1:kind==='sniper'?5:4,intent:'',target:null};
  });
 }
}
function endTurn(){if(phase!=='player'||gameOver)return;skillMode=null;enemyPhase()}
$('skillBtn').onclick=useSkill;$('endTurn').onclick=endTurn;$('cancelSkill').onclick=()=>{skillMode=null;render()};$('waitBtn').onclick=()=>{let s=units.find(u=>u.id===selected);if(s&&s.ap>0){s.ap=0;log(s.name+' 選擇待命。','info');render()}};
planAll();log('任務開始。敵方已部署，請先觀察紅色行動預告。','info');log('移動最多 3 格消耗 1 AP；攻擊消耗 1 AP；技能消耗 2 AP。','info');render();
</script></body></html>
