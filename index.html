{id:'speed',name:'相位穩定器',symbol:'⌁',desc:'移動速度 +9%，閃避冷卻縮短。',rarity:'COMMON',apply:()=>{build.speed=(build.speed||0)+.09;player.dashMax=Math.max(.55,player.dashMax-.12)}},

{id:'chain',name:'電弧矩陣',symbol:'ϟ',desc:'電弧手槍命中後必定連鎖至附近敵人，造成 55% 傷害。',rarity:'RARE',apply:()=>build.chain=(build.chain||0)+1},

{id:'freeze',name:'低溫彈頭',symbol:'❄',desc:'命中有 20% 機率凍結敵人 1.2 秒。',rarity:'RARE',apply:()=>build.freeze=(build.freeze||0)+.2},
{id:'leech',name:'納米汲取',symbol:'♥',desc:'擊殺敵人時恢復 2 HP。',rarity:'RARE',apply:()=>build.leech=(build.leech||0)+2},

{id:'overload',name:'雷霆核心',symbol:'⬡',desc:'電擊連鎖額外跳躍 1 次，連鎖傷害提高。',rarity:'EPIC',apply:()=>build.chainPower=(build.chainPower||0)+.25},

function sound(freq=440,dur=.07,type='sine',vol=.025){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}

$('healBuy').onclick=()=>{if(scrapRun<18)return toast('廢料不足');scrapRun-=18;player.hp=Math.min(player.maxHp,player.hp+45);shopRoom()};$('dmgBuy').onclick=()=>{if(scrapRun<22)return toast('廢料不足');scrapRun-=22;build.damage=(build.damage||0)+.15;shopRoom()};$('leave').onclick=()=>{hidePanel();state='playing';roomCleared=true;last=performance.now();updateHud()};
}
function eventRoom(){state='event';panel('<div class="eyebrow">UNKNOWN SIGNAL // EXPERIMENTAL CACHE</div><h2 style="font:700 25px Orbitron;margin:8px 0">失控實驗室</h2><p class="lede">一座仍在運作的實驗艙向你發出邀請。艙門標示著：神經超頻測試。</p><div class="grid2"><div class="choice"><span class="tag">HIGH RISK</span><h3>接受超頻</h3><p>失去 20 HP，永久於本次出擊獲得 +30% 傷害。</p><button id="risk">啟動實驗</button></div><div class="choice"><span class="tag">SAFE</span><h3>回收能源</h3><p>取得 18 廢料，不承擔額外風險。</p><button id="safe">回收能源</button></div></div>');
$('risk').onclick=()=>{player.hp=Math.max(1,player.hp-20);build.damage=(build.damage||0)+.3;leaveEvent()};$('safe').onclick=()=>{scrapRun+=18;leaveEvent()};
}
function leaveEvent(){hidePanel();state='playing';roomCleared=true;last=performance.now();toast('實驗完成');updateHud()}
function pause(){if(state!=='playing')return;state='paused';panel('<div class="eyebrow">SYSTEM PAUSED</div><h2 style="font:700 27px Orbitron">戰術暫停</h2><p class="lede">目前進度會在本次出擊結束後結算。</p><div class="actions"><button class="primary" id="resume">繼續作戰</button><button id="quit">放棄任務並撤離</button></div>');$('resume').onclick=()=>{state='playing';hidePanel();last=performance.now()};$('quit').onclick=()=>endRun(true)}
function endRun(success){
state='result';$('hud').style.display='none';let carry=success?scrapRun:Math.floor(scrapRun*.45),bonus=success?Math.floor(runStats.rooms*2):0;meta.scrap+=carry+bonus;meta.bestSector=Math.max(meta.bestSector,sector);meta.runs++;save();
panel('<div class="eyebrow">'+(success?'MISSION EXTRACTED':'SIGNAL LOST')+' // DEBRIEF</div><h2 class="brand" style="font-size:32px">'+(success?'成功撤離':'作戰員陣亡')+'</h2><p class="lede">'+(success?'你帶著回收資料返回安全屋。':'NEXUS 已回收你的作戰訊號，但部分資源仍成功送回基地。')+'</p><div class="resultline"><span>抵達區域</span><b>'+sector+'</b></div><div class="resultline"><span>清除房間</span><b>'+runStats.rooms+'</b></div><div class="resultline"><span>擊殺單位</span><b>'+runStats.kills+'</b></div><div class="resultline"><span>本次廢料</span><b>'+scrapRun+'</b></div><div class="resultline"><span>帶回基地</span><b style="color:#55f5f2">+'+(carry+bonus)+' SCRAP</b></div><div class="resultline"><span>累計基地廢料</span><b>'+meta.scrap+'</b></div><div class="actions"><button class="primary" id="again">再次出擊</button><button id="base">基地整備</button><button id="home">主選單</button></div>');
$('again').onclick=startRun;$('base').onclick=baseUpgrade;$('home').onclick=menu;
}
function drawBackground(){
ctx.fillStyle='#080d1b';ctx.fillRect(0,0,W,H);
let g=ctx.createRadialGradient(W*.5,H*.45,20,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#101c35');g.addColorStop(1,'#050812');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.strokeStyle='#28436133';ctx.lineWidth=1;let step=48,ox=(elapsed*5)%step,oy=(elapsed*3)%step;for(let x=-step+ox;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-step+oy;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.strokeStyle='#55f5f21c';ctx.lineWidth=2;ctx.strokeRect(18,18,W-36,H-36);ctx.restore();
for(let i=0;i<7;i++){let x=(i*197+80)%W,y=(i*131+50)%H;ctx.fillStyle='#55f5f20c';ctx.fillRect(x,y,rand(18,60),2)}
}
function glow(x,y,r,color){ctx.shadowBlur=18;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.shadowBlur=0}
function draw(){
drawBackground();
if(state==='playing'||state==='paused'||state==='upgrade'||state==='route'||state==='shop'||state==='event'){
// decorative obstacles
for(let i=0;i<5;i++){let x=100+i*(W-200)/5,y=H*.35+(i%2)*H*.3;ctx.strokeStyle='#31506a55';ctx.lineWidth=2;ctx.strokeRect(x-17,y-17,34,34);ctx.strokeStyle='#55f5f222';ctx.strokeRect(x-12,y-12,24,24)}
pickups.forEach(p=>{glow(p.x,p.y,5,'#8cff9b');ctx.fillStyle='#c8ffd7';ctx.fillRect(p.x-2,p.y-2,4,4)});
turrets.forEach(t=>{ctx.strokeStyle='#8cff9b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,12,0,TAU);ctx.stroke();glow(t.x,t.y,5,'#8cff9b')});
if(player&&(build.drones||0)>0){for(let i=0;i<build.drones;i++){let a=elapsed*1.8+i*TAU/build.drones,dx=Math.cos(a)*(34+i*7),dy=Math.sin(a)*(34+i*7),x=player.x+dx,y=player.y+dy;ctx.strokeStyle='#8cff9b88';ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(x,y);ctx.stroke();glow(x,y,6,'#8cff9b');ctx.strokeStyle='#eaffef';ctx.strokeRect(x-3,y-3,6,6)}}
bullets.forEach(b=>{ctx.shadowBlur=12;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();ctx.shadowBlur=0});
enemyBullets.forEach(b=>glow(b.x,b.y,b.r,b.color));
effects.forEach(fx=>{ctx.save();ctx.globalAlpha=clamp(fx.life/fx.max,0,1);if(fx.type==='line'){ctx.strokeStyle=fx.color;ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor=fx.color;ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);ctx.lineTo(fx.x2,fx.y2);ctx.stroke()}else{ctx.strokeStyle=fx.color;ctx.lineWidth=5;ctx.shadowBlur=22;ctx.shadowColor=fx.color;ctx.beginPath();ctx.arc(fx.x,fx.y,fx.r*(1-fx.life/fx.max*.35),0,TAU);ctx.stroke()}ctx.restore()});
enemies.forEach(e=>{ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.atan2(player.y-e.y,player.x-e.x));ctx.shadowBlur=16;ctx.shadowColor=e.color;ctx.fillStyle=e.hit>0?'#fff':e.burn>0?'#ff9b4a':e.freeze>0?'#8cecff':e.color;ctx.beginPath();if(e.type==='tank'){ctx.rect(-e.r,-e.r,e.r*2,e.r*2)}else{ctx.moveTo(e.r,0);ctx.lineTo(-e.r*.8,-e.r*.8);ctx.lineTo(-e.r*.55,0);ctx.lineTo(-e.r*.8,e.r*.8);ctx.closePath()}ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff9';ctx.stroke();ctx.restore();if(e.burn>0||e.freeze>0){ctx.strokeStyle=e.burn>0?'#ff9b4a':'#8cecff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,TAU);ctx.stroke()}if(e.hp<e.maxHp){ctx.fillStyle='#142337';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);ctx.fillStyle=e.color;ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*e.hp/e.maxHp,3)}});
if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(elapsed*.3);ctx.shadowBlur=28;ctx.shadowColor='#ff4da6';ctx.strokeStyle='#ff4da6';ctx.lineWidth=5;ctx.beginPath();ctx.rect(-boss.r,-boss.r,boss.r*2,boss.r*2);ctx.stroke();ctx.rotate(-elapsed*.6);ctx.strokeStyle='#ffb45d';ctx.beginPath();ctx.arc(0,0,boss.r*.68,0,TAU);ctx.stroke();ctx.fillStyle='#ff4da6';ctx.fillRect(-9,-9,18,18);ctx.restore()}
particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);glow(p.x,p.y,p.size,p.color);ctx.globalAlpha=1});
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.globalAlpha=player.inv>0&&Math.floor(elapsed*18)%2===0?.4:1;ctx.shadowBlur=20;ctx.shadowColor=pilots[selectedPilot].color;ctx.fillStyle=pilots[selectedPilot].color;ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(-11,-10);ctx.lineTo(-7,0);ctx.lineTo(-11,10);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#eaffff';ctx.fillRect(1,-3,8,6);ctx.restore();if(player.shield>0){ctx.strokeStyle='#6eaaffaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.r+8,0,TAU);ctx.stroke()}}
}
if(shake>0){shake=Math.max(0,shake-.6);ctx.translate(rand(-shake,shake),rand(-shake,shake))}
}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;if(state==='playing')update(dt);else elapsed+=dt;draw();if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}
if(state==='playing'&&roomCleared&&!boss){openRoute()}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(state==='playing'){if(e.code==='Space')dash();if(e.code==='Digit1')activeWeapon=1;if(e.code==='Digit2')activeWeapon=2;if(e.code==='KeyE')useAbility();if(e.code==='KeyQ')useUltimate();if(e.code==='Escape')pause()}});
addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousemove',e=>{let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;if(e.button===2&&state==='playing')useAbility()});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
$('weapon1').onclick=()=>activeWeapon=1;$('weapon2').onclick=()=>activeWeapon=2;
addEventListener('blur',()=>{mouse.down=false;keys={};if(state==='playing')pause()});
menu();
})();
</script></body></html>
